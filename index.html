<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanQR - Scanner</title>
    <link rel="stylesheet" href="main.css">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1b4d3e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="QR Scanner">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3408/3408591.png">
</head>
<body>

    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
                <span>ScanQR</span>
            </div>

            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/></svg>
                    <span>Scanner</span>
                </a>
                <a href="logs.html" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
                    <span>Scanned Logs & History</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    <span>Settings</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <div class="main-card">
                <!-- Top Navigation Bar -->
                <div class="top-bar">
                    <div class="tab-group">
                        <button class="tab-btn active" id="scanImageTab">
                            <div class="icon-box">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                            </div>
                            Scan Image
                        </button>
                        <button class="tab-btn" id="cameraTab">
                            <div class="icon-box">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                            </div>
                            Camera
                        </button>
                    </div>
                </div>

                <!-- Main Body -->
                <div class="content-body">
                    <!-- LEFT PANEL -->
                    <div class="left-panel">
                        <!-- 1. SCAN IMAGE VIEW -->
                        <div id="imageView" class="view-panel">
                            <div class="drop-zone" id="dropZone">
                                <div class="upload-icon-wrapper">
                                    <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                                        <path d="M10 18C10 14.6863 12.6863 12 16 12H24.5858C26.177 12 27.703 12.6321 28.8284 13.7574L32.2426 17.1716C33.368 18.2969 34.894 18.929 36.4853 18.929H48C51.3137 18.929 54 21.6153 54 24.929V46C54 49.3137 51.3137 52 48 52H16C12.6863 52 10 49.3137 10 46V18Z" fill="#F59E0B"/>
                                        <path d="M10 24C10 20.6863 12.6863 18 16 18H48C51.3137 18 54 20.6863 54 24V46C54 49.3137 51.3137 52 48 52H16C12.6863 52 10 49.3137 10 46V24Z" fill="#FBBF24"/>
                                        <path d="M32 26L42 38H36V48H28V38H22L32 26Z" fill="#10B981"/>
                                    </svg>
                                </div>
                                <p class="off-title bold">Drag & Drop or Browse</p>
                                <p class="formats-text">PNG · JPG · WEBP · GIF · BMP</p>
                                <input type="file" id="fileInput" accept="image/*" hidden>
                            </div>

                            <div class="image-controls">
                                <button id="browseBtn" class="btn btn-primary">Browse files</button>
                                <button id="pasteBtn" class="btn btn-outline">Paste image</button>
                            </div>
                        </div>

                        <!-- 2. CAMERA VIEW -->
                        <div id="cameraView" class="view-panel" hidden>
                            <div class="preview-box" id="previewContainer">
                                <video id="video" playsinline hidden></video>
                                <div id="qrBoundingBox" class="qr-bounding-box" hidden>
                                    <div class="corner top-left"></div>
                                    <div class="corner top-right"></div>
                                    <div class="corner bottom-left"></div>
                                    <div class="corner bottom-right"></div>
                                    <div class="laser-line"></div>
                                </div>

                                <div id="cameraOffState" class="placeholder-state">
                                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5"><path d="M16 16L1 1M2 6h4l2-3h6l2 3h4a2 2 0 0 1 2 2v9m-4 1H3a2 2 0 0 1-2-2V8c0-.42.13-.81.35-1.15"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                                    <p class="off-title">Camera is off.</p>
                                    <p class="off-sub">Press Start Camera to scan.</p>
                                </div>
                            </div>

                            <div class="camera-controls">
                                <button id="startCamBtn" class="btn btn-primary">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                                    Start Camera
                                </button>
                                <button id="flashBtn" class="btn btn-icon" title="Toggle Flash" disabled>
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                                </button>
                                <button id="switchCamBtn" class="btn btn-icon" title="Switch Camera" disabled>
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                                </button>
                            </div>

                            <div class="camera-select-wrapper">
                                <select id="cameraSelect" class="camera-dropdown">
                                    <option value="">HP HD Camera...</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- RIGHT PANEL: Scanned Result -->
                    <div class="right-panel">
                        <div class="result-header">
                            <h2>Scanned Result</h2>
                            <a href="logs.html" class="btn-history" id="historyBtn">
                                History <span class="badge-dot"></span>
                            </a>
                        </div>

                        <div class="status-indicator">
                            <span class="status-dot"></span>
                            <span id="statusText">Camera inactive</span>
                        </div>

                        <div class="result-display-area" id="resultDisplay">
                            <span class="placeholder-text">Scan a QR code to see results here...</span>
                        </div>

                        <button id="copyResultBtn" class="btn btn-primary-light" disabled>Copy Result</button>
                    </div>
                </div>

                <footer class="app-footer">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
                    <span>Your images never leave this device — 100% browser-based</span>
                </footer>
            </div>
        </main>
    </div>

    <canvas id="canvas" hidden></canvas>
    <script src="main.js"></script>
</body>
<!-- PWA Registration & Install Listener -->
    <script>
        // 1. Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then((reg) => console.log('Scanner Service Worker registered:', reg.scope))
                    .catch((err) => console.warn('Service Worker registration failed:', err));
            });
        }

        // 2. Handle Installation Prompt
        let deferredPrompt;
        const installBtn = document.getElementById('installScannerBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (installBtn) installBtn.style.display = 'block';
        });

        if (installBtn) {
            installBtn.addEventListener('click', async () => {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('Scanner App installed successfully');
                }
                deferredPrompt = null;
                installBtn.style.display = 'none';
            });
        }

        window.addEventListener('appinstalled', () => {
            if (installBtn) installBtn.style.display = 'none';
            deferredPrompt = null;
        });
    </script>
</body>
</html>
