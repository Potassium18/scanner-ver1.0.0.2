<html lang="en">
<head>

    <link rel="stylesheet" href="main.css">
</head>
<body>

    <div class="app-layout">
        <!-- Sidebar Navigation -->

                <span>ScanQR</span>
            </div>

            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/></svg>
                    <span>Scanner</span>
                </a>
                <a href="logs.html" class="nav-item active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
                    <span>Scanned Logs & History</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    <span>Settings</span>
                </a>
            </nav>
        </aside>

        <!-- Main Workspace -->
        <main class="main-content">
            <div class="main-card page-card">
                <div class="page-header">
                    <h2>Scanned Logs & History</h2>
                    <button class="btn btn-outline" id="clearHistoryBtn">Clear History</button>
                </div>

                <div class="logs-container">
                    <table class="logs-table">
                        <thead>
                            <tr>
                                <th>Scanned Image</th>
                                <th>Name</th>
                                <th>College</th>
                                <th>Designation</th>
                                <th>Date & Time</th>
                                <th>Raw Data</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="logsTableBody">
                            <!-- Populated dynamically from main.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="main.js"></script>
</body>
</html>
