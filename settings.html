<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanQR - Settings</title>
    <link rel="stylesheet" href="settings.css">
</head>
<body>

    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
                <span>ScanQR</span>
            </div>

            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/></svg>
                    <span>Scanner</span>
                </a>
                <a href="logs.html" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
                    <span>Scanned Logs & History</span>
                </a>
                <a href="settings.html" class="nav-item active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    <span>Settings</span>
                </a>
            </nav>
        </aside>

        <!-- Main Workspace -->
        <main class="main-content">
            
            <!-- Section 1: Account Settings -->
            <div class="settings-card">
                <h2>Account Settings</h2>
                <div class="form-group">
                    <label for="operatorName">Operator Name / Account:</label>
                    <input type="text" id="operatorName" placeholder="e.g., Block Rep / Admin Name" />
                </div>
                <button type="button" id="saveAccountBtn" class="btn btn-green btn-full">Save Account Info</button>
            </div>

            <!-- Section 2: Google Script URL Management -->
            <div class="settings-card">
                <h2>Google Script URL Management</h2>
                
                <div class="form-group">
                    <label for="savedPresetsSelect">Saved Presets:</label>
                    <select id="savedPresetsSelect">
                        <option value="">-- Select a saved URL --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="presetLabel">Preset Label / Name:</label>
                    <input type="text" id="presetLabel" placeholder="e.g., ATTENDANCE SHEET, DAY 1" />
                </div>

                <div class="form-group">
    <label for="scriptUrl">Google Apps Script Web App URL</label>
    <input 
        type="url" 
        id="scriptUrl" 
        name="scriptUrl" 
        placeholder="https://script.google.com/macros/s/.../exec"
        value=""
    >
</div>

                <div class="button-row">
                    <button type="button" id="savePresetBtn" class="btn btn-green">Save & Label URL</button>
                    <button type="button" id="deletePresetBtn" class="btn btn-danger">Delete Preset</button>
                </div>
            </div>
            <!-- Section 3: Offline Queue Status -->
<div class="settings-card">
    <h2>Offline Sync Queue</h2>
    <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 12px;">
        Items scanned while offline will automatically upload when an internet connection is established.
    </p>
    <div style="display: flex; align-items: center; justify-content: space-between;">
        <span id="queueStatusText" style="font-weight: 600; color: #1e293b;">Pending Items: 0</span>
        <button type="button" id="manualSyncBtn" class="btn btn-green">Sync Now</button>
    </div>
</div>

        </main>
    </div>

    <script src="settings.js"></script>
</body>
</html>
